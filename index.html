<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>送信テスト</title>
</head>
<body>
  <button id="buttonA">A</button>
  <button id="buttonB">B</button>
  <p id="status"></p>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyXRauGOr2oimJBpfe8yar4SPfcHVNiF1MZPNuoU-ut8F6_FQpPrfHbfZA-lfWYBLqfXw/exec';

    const buttonA = document.getElementById('buttonA');
    const buttonB = document.getElementById('buttonB');
    const status = document.getElementById('status');

    // どのボタンが押されても、この関数で送る
    async function send(buttonName) {
      buttonA.disabled = true;           // 送信中は両方押せなくする
      buttonB.disabled = true;
      status.textContent = buttonName + ' を送信中…';
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            clickedAt: new Date().toISOString(),
            button: buttonName           // ← 今回増やした項目
          })
        });
        const json = await res.json();
        status.textContent = json.ok ? buttonName + ' を送信しました' : '失敗しました';
      } catch (err) {
        status.textContent = '送信できませんでした：' + err;
      }
      buttonA.disabled = false;
      buttonB.disabled = false;
    }

    buttonA.addEventListener('click', () => send('A'));
    buttonB.addEventListener('click', () => send('B'));
  </script>
</body>
</html>
